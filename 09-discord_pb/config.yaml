name: "Discord PocketBase"
version: "0.1.0"
slug: "discord_pb"
description: "Self-contained Discord archive with PocketBase admin and idempotent REST backfill."
url: "https://github.com/Soul-Brews-Studio/oracle-haos-factory/tree/lab/01-discord-pb-kvmlab1/09-discord_pb"
