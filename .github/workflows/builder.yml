name: Publish add-on images

# Without published images Supervisor builds on the HA host and can report a
# failed build as a successful update that leaves the old version running. CI
# makes installation a pull and turns a broken build into a visible failed run.
on:
  push:
    branches: [main]
    paths:
      - "01-hello/**"
      - "02-mz_forwarder/**"
      - "03-kvm_monitor/**"
      - "07-digger_node/**"
      - "08-kvm_status/**"
      - ".github/workflows/builder.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.addon.dir }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Publish every architecture advertised by config.yaml; otherwise the
        # store contract says Pi installs work while the required image is absent.
        arch: [amd64, aarch64]
        # One entry per add-on directory. A store that lists an add-on whose
        # image was never published fails at install with "image not found",
        # which reads as a Supervisor fault rather than a missing build.
        addon:
          - { dir: "01-hello", image: "hello" }
          - { dir: "02-mz_forwarder", image: "mz_forwarder" }
          - { dir: "03-kvm_monitor", image: "kvm_monitor" }
          - { dir: "07-digger_node", image: "digger_node" }
          - { dir: "08-kvm_status", image: "kvm_status" }

    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target ${{ matrix.addon.dir }} \
            --image {arch}-addon-${{ matrix.addon.image }} \
            --docker-hub ghcr.io/soul-brews-studio \
            --addon
