name: Publish add-on images

# Without published images Supervisor builds on the HA host and can report a
# failed build as a successful update that leaves the old version running. CI
# makes installation a pull and turns a broken build into a visible failed run.
on:
  push:
    branches: [main]
    paths:
      - "01-hello/**"
      - "02-mz_forwarder/**"
      - "03-kvm_monitor/**"
      - "05-facebook_lance/**"
      - ".github/workflows/builder.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.dir }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Publish exactly the architectures each config.yaml advertises. A
        # cross product would incorrectly build Facebook Lance for aarch64;
        # lancedb-compat currently provides the required glibc wheel for amd64.
        include:
          - { arch: "amd64", dir: "01-hello", image: "hello" }
          - { arch: "aarch64", dir: "01-hello", image: "hello" }
          - { arch: "amd64", dir: "02-mz_forwarder", image: "mz_forwarder" }
          - { arch: "aarch64", dir: "02-mz_forwarder", image: "mz_forwarder" }
          - { arch: "amd64", dir: "03-kvm_monitor", image: "kvm_monitor" }
          - { arch: "aarch64", dir: "03-kvm_monitor", image: "kvm_monitor" }
          - { arch: "amd64", dir: "05-facebook_lance", image: "facebook_lance" }

    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target ${{ matrix.dir }} \
            --image {arch}-addon-${{ matrix.image }} \
            --docker-hub ghcr.io/soul-brews-studio \
            --addon
