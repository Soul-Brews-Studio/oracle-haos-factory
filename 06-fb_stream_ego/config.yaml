name: "FB Stream Ego"
version: "0.1.1"
slug: "fb_stream_ego"
description: >-
  Read-only mirror of the fb-stream-ego Messenger capture (LanceDB on m5):
  threads, newest messages, freshness. Message text is served only through
  the admin Ingress panel; the LAN port carries identity and counts.
url: "https://github.com/Soul-Brews-Studio/oracle-haos-factory/tree/main/06-fb_stream_ego"

# A published image makes installation a pull instead of building on the HAOS
# machine. It also moves failures into CI, where they cannot masquerade as a
# successful update that quietly leaves an old image running.
image: "ghcr.io/soul-brews-studio/{arch}-addon-fb_stream_ego"
arch:
  - amd64
  - aarch64
startup: application
# Reboots must restore the service without a human reopening the add-on page.
boot: auto
# Home Assistant base images already own PID 1 through s6-overlay.
init: false
hassio_api: false
homeassistant_api: false
host_network: false

# Ingress serves a browser with an HA session; API consumers need a stable port
# because they cannot authenticate to or address an ingress URL.
ingress: true
ingress_port: 8105
panel_icon: mdi:facebook-messenger
panel_title: "FB Stream Ego"
# Private chats: only Home Assistant admins get the sidebar panel.
panel_admin: true
ports:
  8105/tcp: 8105
ports_description:
  8105/tcp: "Health and counts API (no message text outside Ingress)"

# /data is the only add-on path Supervisor persists across updates and includes
# in Home Assistant backups, even when this first scaffold stores nothing yet.
map:
  - data:rw
stage: experimental

# Generated from the same option definitions as run.sh and server.ts. Adding an
# option to only this surface recreates Trap 6 and is intentionally unsupported.
options:
  exporter_url: "http://a0d7b954-ssh:18795"
  refresh_seconds: 10
schema:
  # String options use str. An empty default under url? fails validation before
  # the container exists, so the add-on log is empty and points at the wrong layer.
  exporter_url: str
  refresh_seconds: int
  # Shared bearer token for the exporter relay. Optional fields must have no
  # default in `options`; it is set after install through the Supervisor API
  # (see the lab justfile) and reaches the process only via the environment.
  exporter_token: password?
