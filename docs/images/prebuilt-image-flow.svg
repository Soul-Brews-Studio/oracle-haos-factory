<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc">
  <title id="title">Prebuilt add-on image flow</title>
  <desc id="desc">A push triggers GitHub Actions, builds amd64 and aarch64 images, publishes them to GHCR, and lets Home Assistant pull rather than build locally.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker>
    <style>
      .box { fill:#f8fafc; stroke:#334e68; stroke-width:2; rx:14; }
      .good { fill:#ecfdf5; stroke:#047857; }
      .warn { fill:#fff7ed; stroke:#c2410c; }
      .text { font: 17px system-ui, sans-serif; fill:#102a43; text-anchor:middle; }
      .small { font: 14px system-ui, sans-serif; fill:#486581; text-anchor:middle; }
      .line { stroke:#52606d; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="310" fill="#ffffff"/>
  <rect class="box" x="35" y="80" width="190" height="115"/>
  <text class="text" x="130" y="120">Push to main</text>
  <text class="small" x="130" y="151">01-hello/** changed</text>
  <rect class="box" x="300" y="80" width="210" height="115"/>
  <text class="text" x="405" y="120">GitHub Actions</text>
  <text class="small" x="405" y="151">HA builder matrix</text>
  <rect class="box good" x="585" y="40" width="210" height="95"/>
  <text class="text" x="690" y="78">amd64 image</text>
  <text class="small" x="690" y="105">published to GHCR</text>
  <rect class="box good" x="585" y="175" width="210" height="95"/>
  <text class="text" x="690" y="213">aarch64 image</text>
  <text class="small" x="690" y="240">published to GHCR</text>
  <rect class="box warn" x="870" y="80" width="195" height="115"/>
  <text class="text" x="967" y="120">Supervisor</text>
  <text class="small" x="967" y="149">pulls; never builds</text>
  <text class="small" x="967" y="171">on the HA host</text>
  <path class="line" d="M225 137 H290"/>
  <path class="line" d="M510 118 C545 118 545 87 575 87"/>
  <path class="line" d="M510 157 C545 157 545 222 575 222"/>
  <path class="line" d="M795 87 C830 87 830 118 860 118"/>
  <path class="line" d="M795 222 C830 222 830 157 860 157"/>
</svg>
