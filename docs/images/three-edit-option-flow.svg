<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">The three-edit option path</title>
  <desc id="desc">The greeting option moves from config.yaml through Supervisor and run.sh into the GREETING environment variable read by server.ts. Omitting run.sh leaves stored configuration disconnected from runtime behavior.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker>
    <style>
      .box { fill:#f8fafc; stroke:#334e68; stroke-width:2; rx:14; }
      .bridge { fill:#fef2f2; stroke:#b91c1c; stroke-width:3; }
      .result { fill:#ecfdf5; stroke:#047857; }
      .text { font: 17px system-ui, sans-serif; fill:#102a43; text-anchor:middle; }
      .small { font: 14px system-ui, sans-serif; fill:#486581; text-anchor:middle; }
      .danger { font: 14px system-ui, sans-serif; fill:#991b1b; text-anchor:middle; font-weight:600; }
      .line { stroke:#52606d; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .broken { stroke:#b91c1c; stroke-width:3; stroke-dasharray:8 7; fill:none; }
    </style>
  </defs>
  <rect width="1100" height="390" fill="#ffffff"/>
  <rect class="box" x="25" y="70" width="190" height="115"/>
  <text class="text" x="120" y="108">1 · config.yaml</text>
  <text class="small" x="120" y="138">default + schema</text>
  <text class="small" x="120" y="160">greeting: str</text>
  <rect class="box" x="275" y="70" width="190" height="115"/>
  <text class="text" x="370" y="108">Supervisor</text>
  <text class="small" x="370" y="138">stores “สวัสดี”</text>
  <text class="small" x="370" y="160">UI looks correct</text>
  <rect class="box bridge" x="525" y="55" width="210" height="145"/>
  <text class="text" x="630" y="95">2 · run.sh</text>
  <text class="small" x="630" y="126">bashio::config</text>
  <text class="small" x="630" y="149">export GREETING</text>
  <text class="danger" x="630" y="178">missing bridge = trap</text>
  <rect class="box" x="795" y="70" width="190" height="115"/>
  <text class="text" x="890" y="108">3 · server.ts</text>
  <text class="small" x="890" y="138">process.env.GREETING</text>
  <text class="small" x="890" y="160">runtime behavior</text>
  <path class="line" d="M215 127 H265"/>
  <path class="line" d="M465 127 H515"/>
  <path class="line" d="M735 127 H785"/>
  <rect class="box result" x="795" y="260" width="190" height="90"/>
  <text class="text" x="890" y="297">Live proof</text>
  <text class="small" x="890" y="325">GET / → “สวัสดี”</text>
  <path class="line" d="M890 185 V250"/>
  <path class="broken" d="M370 200 C370 315 625 315 625 210"/>
  <text class="danger" x="500" y="345">Stored value cannot jump directly into the process</text>
</svg>
