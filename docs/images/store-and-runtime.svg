<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Oracle HAOS Factory store and runtime architecture</title>
  <desc id="desc">The store repository is discovered by Supervisor, which pulls a prebuilt image and starts the hello add-on. Browser traffic uses ingress while API traffic uses port 8099.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker>
    <style>
      .box { fill:#f8fafc; stroke:#334e68; stroke-width:2; rx:14; }
      .accent { fill:#e6fffa; stroke:#0f766e; }
      .runtime { fill:#fff7ed; stroke:#c2410c; }
      .text { font: 17px system-ui, sans-serif; fill:#102a43; text-anchor:middle; }
      .small { font: 14px system-ui, sans-serif; fill:#486581; text-anchor:middle; }
      .line { stroke:#52606d; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="430" fill="#ffffff"/>
  <rect class="box accent" x="40" y="55" width="240" height="120"/>
  <text class="text" x="160" y="92">Store repository</text>
  <text class="small" x="160" y="122">repository.yaml</text>
  <text class="small" x="160" y="146">01-hello/config.yaml</text>

  <rect class="box" x="430" y="55" width="240" height="120"/>
  <text class="text" x="550" y="98">HA Supervisor</text>
  <text class="small" x="550" y="128">discovers manifest</text>
  <text class="small" x="550" y="151">pulls, configures, starts</text>

  <rect class="box accent" x="820" y="55" width="240" height="120"/>
  <text class="text" x="940" y="92">GHCR</text>
  <text class="small" x="940" y="122">amd64-addon-hello</text>
  <text class="small" x="940" y="146">aarch64-addon-hello</text>

  <path class="line" d="M280 115 H420"/>
  <text class="small" x="350" y="101">store metadata</text>
  <path class="line" d="M670 115 H810"/>
  <text class="small" x="740" y="101">image pull</text>

  <rect class="box runtime" x="430" y="260" width="240" height="120"/>
  <text class="text" x="550" y="297">hello container</text>
  <text class="small" x="550" y="327">Bun on 0.0.0.0:8099</text>
  <text class="small" x="550" y="351">GET / · GET /api/health</text>
  <path class="line" d="M550 175 V250"/>

  <rect class="box" x="40" y="260" width="240" height="120"/>
  <text class="text" x="160" y="302">HA browser session</text>
  <text class="small" x="160" y="332">sidebar ingress</text>
  <path class="line" d="M280 320 H420"/>

  <rect class="box" x="820" y="260" width="240" height="120"/>
  <text class="text" x="940" y="302">API client</text>
  <text class="small" x="940" y="332">stable LAN port 8099</text>
  <path class="line" d="M820 320 H680"/>
</svg>
